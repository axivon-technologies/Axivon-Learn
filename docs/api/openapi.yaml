openapi: 3.0.3
info:
  title: AXIVON LEARN REST API
  description: Official REST API specification for AXIVON LEARN (Axivon Technologies)
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server healthy
  /auth/register:
    post:
      summary: Register learner
      responses:
        '201':
          description: User registered
        '400':
          description: Validation error
  /auth/login:
    post:
      summary: User login
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
  /courses:
    get:
      summary: Get published courses
      responses:
        '200':
          description: List of courses
  /courses/{slug}:
    get:
      summary: Get course detail with syllabus
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course detail
        '404':
          description: Course not found
  /admin/overview:
    get:
      summary: Get admin metrics overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin metrics
        '403':
          description: Forbidden for non-admins
